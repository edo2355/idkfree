name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'  # Actualizado a 22 para evitar el warning

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: |
          cd mobile
          npm install --legacy-peer-deps

      - name: Remove dev-client for production
        run: |
          cd mobile
          # 1. Desinstalar el paquete (sin fallar si no existe)
          npm uninstall expo-dev-client || true
          
          # 2. Limpiar el plugin del app.json
          node -e "
            const fs = require('fs');
            const p = 'app.json';
            let data = JSON.parse(fs.readFileSync(p, 'utf8'));
            if (data.expo && data.expo.plugins) {
              data.expo.plugins = data.expo.plugins.filter(plugin => {
                const name = typeof plugin === 'string' ? plugin : (Array.isArray(plugin) ? plugin[0] : '');
                return name !== 'expo-dev-client';
              });
              fs.writeFileSync(p, JSON.stringify(data, null, 2));
              console.log('✅ expo-dev-client eliminado de app.json');
            } else {
              console.log('⚠️ No se encontró la sección plugins en app.json');
            }
          "

      - name: Generate native Android folder
        run: |
          cd mobile
          npx expo prebuild --platform android --clean

      - name: Build APK
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Decode Keystore
        env:
          ENCODED_STRING: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$ENCODED_STRING" | tr -d ' \n\r\t' | base64 -d > mobile/android/app/idkfree-release.keystore

      - name: Sign APK
        run: |
          UNSIGNED_APK=$(find mobile/android/app/build/outputs/apk/release -name "*.apk" | grep -v "signed" | head -n 1)
          echo "Firmando: $UNSIGNED_APK"
          
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks mobile/android/app/idkfree-release.keystore \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            --out mobile/android/app/build/outputs/apk/release/IDKfree-Signed.apk \
            "$UNSIGNED_APK"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: IDKfree-APK-Final
          path: mobile/android/app/build/outputs/apk/release/IDKfree-Signed.apk
          retention-days: 7
