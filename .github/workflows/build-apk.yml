name: Build Android APK (Firmada)

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: |
          cd mobile
          npm install --legacy-peer-deps

      - name: Remove dev-client package
        run: |
          cd mobile
          npm uninstall expo-dev-client || true

      - name: Generate native Android folder
        run: |
          cd mobile
          npx expo prebuild --platform android --clean

      - name: Decode Keystore
        env:
          ENCODED_STRING: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$ENCODED_STRING" | tr -d ' \n\r\t' | base64 -d > mobile/android/app/idkfree-release.keystore

      - name: Inject Signing Config into build.gradle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd mobile/android/app
          python3 -c "
import re
path = 'build.gradle'
with open(path, 'r') as f: content = f.read()

# Inyectar bloque de firma release
signing_block = '''
        release {
            if (System.getenv('KEYSTORE_PASSWORD') != null) {
                storeFile file('idkfree-release.keystore')
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
'''
if 'idkfree-release.keystore' not in content:
    content = content.replace('signingConfigs {', 'signingConfigs {' + signing_block, 1)
    content = re.sub(r'(buildTypes\s*\{[\s\S]*?release\s*\{[^}]*?signingConfig)\s+signingConfigs\.debug', r'\1 signingConfigs.release', content)

with open(path, 'w') as f: f.write(content)
"
          echo "=== Verificando firma ==="
          grep -A 5 "signingConfigs {" build.gradle | head -10
          grep -A 5 "buildTypes {" build.gradle | head -10

      - name: Build APK (signed)
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m" # <--- 4GB de RAM para evitar OOM
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: IDKMedia-APK-Firmada-ARM64
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
