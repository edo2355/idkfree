name: Build IDKFREE APK

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        working-directory: ./mobile
        run: npm install --no-audit --no-fund --legacy-peer-deps --no-audit --no-fund --legacy-peer-deps

      - name: Prebuild Android
        working-directory: ./mobile
        run: npx expo prebuild --clean -p android

      - name: Download and Setup Gradle 8.14.3 Manually
        run: |
          echo "📥 Descargando Gradle 8.14.3..."
          wget -q https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          unzip -q gradle-8.14.3-bin.zip
          echo "✅ Gradle 8.14.3 descargado."
          export PATH=$PATH:$(pwd)/gradle-8.14.3/bin

      - name: Build APK
        working-directory: ./mobile/android
        run: |
          export PATH=$PATH:$(pwd)/../../gradle-8.14.3/bin
          echo "🔨 Compilando con Gradle 8.14.3..."
          gradle assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/keystore.jks \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: idkfree-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
