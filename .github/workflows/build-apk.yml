name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar dependencias
        run: |
          cd mobile
          npm install --legacy-peer-deps

      - name: Generar carpeta Android (Expo Prebuild)
        run: |
          cd mobile
          npx expo prebuild --platform android --no-install

      - name: Compilar APK SIN Firmar (Gradle)
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a

      - name: Configurar Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Firmar APK con apksigner
        run: |
          UNSIGNED_APK=$(find mobile/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Firmando: $UNSIGNED_APK"
          
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks release.keystore \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --out app-release-signed.apk \
            "$UNSIGNED_APK"

      - name: Subir APK Firmada
        uses: actions/upload-artifact@v4
        with:
          name: IDKFREE-APK-FIRMADA
          path: app-release-signed.apk
