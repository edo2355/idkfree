name: Build IDKFREE APK

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        working-directory: ./mobile
        run: npm install

      - name: Prebuild Android
        working-directory: ./mobile
        run: npx expo prebuild --clean -p android

      - name: Force Gradle 8.14.3
        working-directory: ./mobile/android
        run: |
          echo "ANTES:"
          cat gradle/wrapper/gradle-wrapper.properties
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.3-bin.zip|' gradle/wrapper/gradle-wrapper.properties
          echo "DESPUÉS:"
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Clean Gradle
        working-directory: ./mobile/android
        run: ./gradlew clean

      - name: Build APK
        working-directory: ./mobile/android
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: idkfree-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
