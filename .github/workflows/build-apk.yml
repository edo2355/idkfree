name: Build Android APK (Sin LiveKit)

on:
  workflow_dispatch:
  push:
    branches:
      - sin-livekit
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 📦 Instalar dependencias
        run: |
          if [ -d "mobile" ]; then
            cd mobile
          fi
          npm install

      - name: 📱 Generar carpeta nativa (Expo Prebuild)
        run: |
          TARGET_DIR="."
          if [ -d "mobile" ]; then TARGET_DIR="mobile"; fi
          cd $TARGET_DIR
          npx expo prebuild --platform android --clean

      - name: 🛡️ Corregir reglas de ProGuard / R8
        run: |
          PROGUARD_FILE=""
          if [ -f "mobile/android/app/proguard-rules.pro" ]; then
            PROGUARD_FILE="mobile/android/app/proguard-rules.pro"
          elif [ -f "android/app/proguard-rules.pro" ]; then
            PROGUARD_FILE="android/app/proguard-rules.pro"
          fi

          if [ -n "$PROGUARD_FILE" ]; then
            echo "Añadiendo reglas de exclusión a $PROGUARD_FILE..."
            cat << 'PROGUARD_RULES' >> "$PROGUARD_FILE"

# Solución R8 para módulos de Expo
-dontwarn expo.modules.**
-dontwarn com.facebook.react.**
-keep class expo.modules.** { *; }
-keepclassmembers class * {
    @expo.modules.kotlin.types.* <methods>;
}
-ignorewarnings
PROGUARD_RULES
          fi

      - name: 🔨 Compilar APK Release
        run: |
          TARGET_DIR="."
          if [ -d "mobile/android" ]; then TARGET_DIR="mobile"; fi
          cd $TARGET_DIR/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 📤 Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: idkfree-app-release
          path: |
            **/android/app/build/outputs/apk/release/*.apk
