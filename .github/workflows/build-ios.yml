name: Build iOS (IPA)

on:
  workflow_dispatch: # Se activa manualmente desde GitHub

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install dependencies
        run: |
          cd mobile
          npm install --legacy-peer-deps
          
      - name: Prebuild iOS
        run: |
          cd mobile
          npx expo prebuild -p ios --clean
          
      - name: Install Pods
        run: |
          cd mobile/ios
          pod install
          
      - name: Build IPA (Unsigned)
        run: |
          cd mobile/ios
          xcodebuild -workspace IDKMEDIA.xcworkspace -scheme IDKMEDIA -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO
          
      - name: Package IPA
        run: |
          cd mobile/ios/build/Build/Products/Release-iphoneos
          mkdir Payload
          mv IDKMEDIA.app Payload/
