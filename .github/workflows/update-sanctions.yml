name: Update OFAC Sanctions List
on:
  schedule:
    - cron: '0 0 * * 0' # Cada domingo a las 00:00 UTC
  workflow_dispatch:      # Permite ejecutarlo manualmente desde GitHub

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download SDN.CSV
        run: |
          curl -L -o backend/data/sanctions/sdn.csv "https://sanctionslistservice.ofac.treas.gov/api/PublicationPreview/exports/SDN.CSV"
      
      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/sanctions/sdn.csv
          git diff --staged --quiet || git commit -m "chore: actualizar lista OFAC SDN automáticamente"
          git push
