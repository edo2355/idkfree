name: Build CPanel APK

on:
  push:
    branches: [ main ]
    paths:
      - 'cpanel/**'
      - '.github/workflows/build-cpanel.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Install Dependencies
        working-directory: ./cpanel
        run: npm install
        
      - name: Build Web Assets
        working-directory: ./cpanel
        run: npm run build
        
      - name: Sync Capacitor
        working-directory: ./cpanel
        run: npx cap sync android
        
      - name: Build APK
        working-directory: ./cpanel/android
        run: ./gradlew assembleDebug
        
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: cpanel-apk
          path: cpanel/android/app/build/outputs/apk/debug/app-debug.apk
